name: Better Repos CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      app_name: ${{ steps.meta.outputs.APP_NAME }}
      app_version: ${{ steps.meta.outputs.APP_VERSION }}
      build_commit: ${{ steps.meta.outputs.BUILD_COMMIT }}
      build_date: ${{ steps.meta.outputs.BUILD_DATE }}
      app_env: ${{ steps.meta.outputs.APP_ENV }}
      allowed_origins: ${{ steps.meta.outputs.ALLOWED_ORIGINS }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Validate required CI variables
        id: meta
        env:
          GITHUB_USERNAME: ${{ secrets.GITHUB_USERNAME }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          APP_ENV: ${{ vars.APP_ENV }}
          ALLOWED_ORIGINS: ${{ vars.ALLOWED_ORIGINS }}
        run: |
          node scripts/ci/prepare.mjs > ci.env
          while IFS='=' read -r key value; do
            echo "${key}=${value}" >> "$GITHUB_OUTPUT"
          done < ci.env

  build:
    name: Build
    needs: prepare
    runs-on: ubuntu-latest
    env:
      APP_NAME: ${{ needs.prepare.outputs.app_name }}
      APP_VERSION: ${{ needs.prepare.outputs.app_version }}
      BUILD_COMMIT: ${{ needs.prepare.outputs.build_commit }}
      BUILD_DATE: ${{ needs.prepare.outputs.build_date }}
      APP_ENV: ${{ needs.prepare.outputs.app_env }}
      ALLOWED_ORIGINS: ${{ needs.prepare.outputs.allowed_origins }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Run build validation
        run: |
          npm run typecheck
          node -e "console.log('Build ready for', process.env.APP_NAME, process.env.APP_VERSION, process.env.BUILD_COMMIT)"

  deploy:
    name: Deploy
    needs:
      - prepare
      - build
    runs-on: ubuntu-latest
    env:
      APP_NAME: ${{ needs.prepare.outputs.app_name }}
      APP_VERSION: ${{ needs.prepare.outputs.app_version }}
      BUILD_COMMIT: ${{ needs.prepare.outputs.build_commit }}
      BUILD_DATE: ${{ needs.prepare.outputs.build_date }}
      APP_ENV: ${{ needs.prepare.outputs.app_env }}
      ALLOWED_ORIGINS: ${{ needs.prepare.outputs.allowed_origins }}
      GITHUB_USERNAME: ${{ secrets.GITHUB_USERNAME }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Deploy to Cloudflare Workers
        run: |
          printf '%s' "$GITHUB_USERNAME" | npx wrangler secret put GITHUB_USERNAME --name "$APP_NAME"
          printf '%s' "$GITHUB_TOKEN" | npx wrangler secret put GITHUB_TOKEN --name "$APP_NAME"
          npx wrangler deploy \
            --var APP_NAME="$APP_NAME" \
            --var APP_VERSION="$APP_VERSION" \
            --var BUILD_COMMIT="$BUILD_COMMIT" \
            --var BUILD_DATE="$BUILD_DATE" \
            --var APP_ENV="$APP_ENV" \
            --var ALLOWED_ORIGINS="$ALLOWED_ORIGINS" \
            --var GITHUB_USERNAME="$GITHUB_USERNAME"
